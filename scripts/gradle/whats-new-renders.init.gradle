// Lets the build run the What's New renderer on a newer IDE than the compile baseline; see docs/UI_PREVIEW.md.
allprojects {
    afterEvaluate { project ->
        // The newer IDE's JBR is a Java version the build's Kotlin compiler cannot target, and its Kotlin metadata is newer.
        project.tasks.matching { it.class.name.contains('KotlinCompile') }.configureEach { task ->
            def target = task.class.classLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmTarget')
            task.compilerOptions.jvmTarget.set(target.valueOf('JVM_21'))
            task.compilerOptions.freeCompilerArgs.add('-Xskip-metadata-version-check')
        }
        // Compile only the renderer and what it uses: other fixture tests may use internal API that has moved.
        project.tasks.matching { it.name == 'compilePlatformTestJava' }.configureEach { task ->
            task.include('**/WhatsNewRendersJavaFixtureTest.java', '**/SqlCardActionsJavaFixtureTest.java', '**/H2SqlFixtureTestCase.java', '**/FixtureConnections.java')
        }
    }
}
