version=${version}
edition=0.1.0-alpha
since=0.0.2-alpha
summary=More data sources. Clearer table changes. A closer look at every value.
features=inspector,alter,connections
inspector.title=Inspect, edit, then stage
inspector.description=Work with long or structured values in the value inspector, with column details close at hand.
inspector.steps=Select a table cell and choose Inspect (Alt+Enter).|Choose Edit value, then type or choose Set default or Set NULL.|Stage change queues the edit. Commit saves it; Revert discards a staged change.
inspector.image=side-panel.png
inspector.alt=Table editor with the value inspector open beside a selected email cell
alter.title=See every table change before applying it
alter.description=The redesigned alter-table dialog puts columns, their properties, and the generated SQL in one place.
alter.steps=Open Alter table from a table's context menu.|Select a column to edit its definition, or add a new column.|Review the complete SQL preview before applying the batch.
alter.image=alter-table-dialog.png
alter.alt=Alter-table dialog showing column navigation, column properties and SQL preview
connections.title=Connect to more of your data
connections.description=PostgreSQL and H2 join MySQL and HSQLDB, with an explorer that groups and searches your sources.
connections.steps=Choose Add connection and select your database engine.|Configure the connection and use Test Connection before saving.|Use source filters and search to find objects. Startup and later refreshes preserve your explorer view.
connections.image=connection-dialog.png
connections.alt=Connection dialog with database source selection, connection settings and driver options
