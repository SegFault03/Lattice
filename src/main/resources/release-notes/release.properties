version=${version}
edition=0.2.0-alpha
since=0.1.0-alpha
summary=Lattice now works where you write SQL: in .sql files and in Java and Kotlin strings, aware of your schema. In IntelliJ IDEA Ultimate this support starts off; turn it on under Settings > Tools > Lattice SQL Editor. SQL cards and dry runs there need the Database plugin disabled. In the Community edition it stays on, and you may notice conflicts if that plugin is enabled.
features=schema,strings,dryrun,validation
schema.label=Schema-aware SQL
schema.title=Write SQL that knows your schema
schema.description=Highlighting, completion and hover in .sql files follow the database dialect and schema of the connection you choose.
schema.steps=Open a .sql file. The only saved connection applies by itself; otherwise choose one from the SQL entry in the status bar.|Type: tables, columns and keywords are offered as you go. After JOIN, a foreign key writes the table, alias and condition for you.|Rest the mouse on a name, or press Ctrl+Q, for its comment, columns, keys and what references it.
schema.image=guide-schema.png
schema.alt=SQL file with schema colors, a completion list offering foreign key joins and a hover card describing the customers table
strings.label=SQL in your code
strings.title=Work with SQL in Java and Kotlin strings
strings.description=Strings passed to JDBC, Spring, JPA, Hibernate, jOOQ and Exposed calls get the same support, and each one sits on a card with its own toolbar.
strings.steps=Write SQL in a string. Known calls and strings that clearly read as SQL are recognized; mark any other with // language=SQL.|Rest the mouse on a card, or put the caret in it, to bring up its toolbar.|Run a query, use Run and Roll Back on any other statement, Send to Console, or Copy SQL as plain text.
strings.image=guide-strings.png
strings.alt=Java file with SQL strings on cards and a toolbar above the update statement's card
dryrun.label=Dry runs
dryrun.title=Try a statement before it counts
dryrun.description=Explain shows the execution plan without running anything. Run and Roll Back reports the rows a change affects, then always undoes it.
dryrun.steps=Right-click a statement and open Lattice SQL, press Alt+Enter, or use its card's toolbar.|Type each parameter on the card exactly as it should appear in the SQL, and press Enter.|Read the plan or row count in the Dry Run tab. A confirmation first lists what a rollback does not undo, such as triggers with outside effects.
dryrun.image=guide-dry-run.png
dryrun.alt=Parameter card over an update statement, above a Dry Run tab reporting three rows affected and rolled back
validation.label=Validation
validation.title=Catch mistakes before you run them
validation.description=Syntax errors, unknown tables and columns, ambiguous columns and alias mistakes are underlined as you type, with no calls to the database.
validation.steps=Choose a connection for the file: table and column checks use its cached schema, and stay quiet while that may be out of date.|Press Alt+Enter on a finding to apply a did-you-mean fix or to suppress it.|Set each check's severity under Settings > Editor > Inspections > Lattice SQL.
validation.image=guide-validation.png
validation.alt=SQL file with a misspelled keyword, column and table underlined, and a message suggesting the correct table name
