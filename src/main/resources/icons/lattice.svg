<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Greyish fill for the header row -->
  <path d="M 2 4.5 Q 2 2 4.5 2 L 11.5 2 Q 14 2 14 4.5 L 14 6 L 2 6 Z" fill="#6C707E" fill-opacity="0.28"/>
  <!-- Outer rounded frame -->
  <rect x="2" y="2" width="12" height="12" rx="2.5" fill="none" stroke="#6C707E" stroke-width="1.2"/>
  <!-- Horizontal divider lines -->
  <line x1="2" y1="6" x2="14" y2="6" stroke="#6C707E" stroke-width="1.1"/>
  <line x1="2" y1="10" x2="14" y2="10" stroke="#6C707E" stroke-width="1.1"/>
  <!-- Vertical divider lines -->
  <line x1="6" y1="2" x2="6" y2="14" stroke="#6C707E" stroke-width="1.1"/>
  <line x1="10" y1="2" x2="10" y2="14" stroke="#6C707E" stroke-width="1.1"/>
  <!-- Perimeter and intersection lattice nodes -->
  <circle cx="6" cy="2" r="0.8" fill="#6C707E"/>
  <circle cx="10" cy="2" r="0.8" fill="#6C707E"/>
  <circle cx="2" cy="6" r="0.8" fill="#6C707E"/>
  <circle cx="6" cy="6" r="1.0" fill="#6C707E"/>
  <circle cx="10" cy="6" r="1.0" fill="#6C707E"/>
  <circle cx="14" cy="6" r="0.8" fill="#6C707E"/>
  <circle cx="2" cy="10" r="0.8" fill="#6C707E"/>
  <circle cx="6" cy="10" r="1.0" fill="#6C707E"/>
  <circle cx="10" cy="10" r="1.0" fill="#6C707E"/>
  <circle cx="14" cy="10" r="0.8" fill="#6C707E"/>
  <circle cx="6" cy="14" r="0.8" fill="#6C707E"/>
  <circle cx="10" cy="14" r="0.8" fill="#6C707E"/>
</svg>
