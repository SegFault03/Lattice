  <line x1="10" y1="2" x2="10" y2="14" stroke="#6C707E" stroke-width="1.1"/>
  <!-- Perimeter and intersection lattice nodes -->
  <circle cx="6" cy="2" r="0.8" fill="#059669"/>
  <circle cx="10" cy="2" r="0.8" fill="#059669"/>
  <circle cx="2" cy="6" r="0.8" fill="#059669"/>
  <circle cx="6" cy="6" r="1.0" fill="#059669"/>
  <circle cx="10" cy="6" r="1.0" fill="#059669"/>
