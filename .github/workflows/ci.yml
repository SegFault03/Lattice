# Before editing, read AGENTS.md and docs/CI_TESTING.md#before-changing-ci.
# Keep policy, suite selection, workflow tests and related guides aligned.
name: Build and validation

on:
  push:
    branches: ['**']
  pull_request:
    # Check the prospective merge, including PRs retargeted to main.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1: embedded functional contracts and plugin packaging on every commit.
  functional-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Run functional tests and build plugin
        run: python scripts/test.py --functional-only --build
      - name: Validate plugin archive
        shell: bash
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '\r')"
          python scripts/check-release-archive.py "build/distributions/Lattice-$version.zip" --version "$version"
      - name: Retain exact plugin for main PR verification
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-under-test
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 1
      - name: Retain functional reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-${{ matrix.os }}
          path: |
            build/reports/tests/functionalTest/
            build/test-results/functionalTest/
          retention-days: 7

  # Tier 2: the rest of validation runs only on PRs targeting main.
  tooling-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tooling and workflow regressions
        run: python -m unittest discover -s scripts/tests -v

  backend-tests:
    needs: functional-build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Run service model and Swing regressions
        shell: bash
        run: ./gradlew regressionTest --no-daemon
      - name: Run H2 transports and packaged driver checks
        if: matrix.os != 'ubuntu-24.04'
        shell: bash
        run: ./gradlew h2IntegrationTest h2FallbackDriverTest --no-daemon
      - name: Run live database integration and all packaged drivers
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/test.py --integration-only --live --mysql --hsqldb --postgres
      - name: Retain backend diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
            build/fixtures/
          retention-days: 7

  ui-tests:
    needs: functional-build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    strategy:
      fail-fast: false
      # Separate jobs keep one UI failure from suppressing another suite's evidence.
      matrix:
        include:
          - suite: previews
            theme: both
          - suite: hsqldb
            theme: ExperimentalDark
          - suite: styling
            theme: ExperimentalLight
          - suite: search
            theme: ExperimentalDark
          - suite: search
            theme: ExperimentalLight
          - suite: postgres
            theme: ExperimentalDark
          - suite: h2
            theme: ExperimentalDark
          - suite: h2
            theme: ExperimentalLight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LATTICE_UI_REVIEW_OUTPUT: build/ui-review/${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Prepare IDE SDK
        run: ./gradlew writeUiIdeHome --no-daemon
      - name: Prepare real IDE display
        if: matrix.suite != 'previews'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 x11-utils
      - name: Run production Swing previews and painted badge checks
        if: matrix.suite == 'previews'
        run: python3 scripts/ui-preview.py --all-previews --ide-home "$(cat build/ui-ide-home.txt)"
      - name: Run HSQLDB functional UI or focused styling and search
        if: matrix.suite == 'hsqldb' || matrix.suite == 'styling' || matrix.suite == 'search'
        env:
          LATTICE_UI_STYLE_ONLY: ${{ matrix.suite == 'styling' }}
          LATTICE_UI_EXPLORER_SEARCH_ONLY: ${{ matrix.suite == 'search' }}
          UI_THEME: ${{ matrix.theme }}
        run: ./scripts/linux/review-intellij-ui.sh "$UI_THEME"
      - name: Run PostgreSQL functional UI
        if: matrix.suite == 'postgres'
        env:
          UI_THEME: ${{ matrix.theme }}
        run: >-
          python3 scripts/postgres-ui-review.py --java-home "$JAVA_HOME"
          --ide-home "$(cat build/ui-ide-home.txt)" --output build/ui-review/postgres
          --themes "$UI_THEME" --cleanup
      - name: Run H2 functional UI
        if: matrix.suite == 'h2'
        env:
          UI_THEME: ${{ matrix.theme }}
        run: >-
          python3 scripts/h2-test.py --ui-only --java-home "$JAVA_HOME"
          --ide-home "$(cat build/ui-ide-home.txt)" --output build/ui-review/h2 --themes "$UI_THEME"
      - name: Retain UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-${{ matrix.suite }}-${{ matrix.theme }}
          path: |
            build/test-results/uiScreenshotTest/
            build/ui-review/
            build/ui-preview/
            out/ide-tests/tests/**/log/idea.log
            out/ide-tests/tests/**/log/monitoring-thread-dumps-ide/
            out/ide-tests/tests/**/log/screenshots/
          retention-days: 7

  ide-compatibility:
    needs: functional-build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        ide: ['2025.1', '2025.2', '2025.3']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-under-test
          path: build/distributions
      - name: Verify exact functional-tested plugin
        env:
          IDE_VERSION: ${{ matrix.ide }}
        run: |
          archives=(build/distributions/*.zip)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
          python3 scripts/verify-plugin.py "${archives[0]}" --ide-version "$IDE_VERSION"             --java-home "$JAVA_HOME" --cache "$RUNNER_TEMP/lattice-test-binaries"
      - name: Retain IDE compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-ide-${{ matrix.ide }}
          if-no-files-found: ignore
          path: build/compatibility/verifier-ci/
          retention-days: 7

  database-compatibility:
    needs: functional-build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Run JDBC server and Java runtime matrices
        run: python3 scripts/one-shot-test.py --database-compatibility-only
      - name: Retain JDBC and Java reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-jdbc-java
          if-no-files-found: ignore
          path: |
            build/compatibility/
            build/one-shot-test/
          retention-days: 7

  full-validation:
    needs: [functional-build, tooling-tests, backend-tests, ui-tests, ide-compatibility, database-compatibility]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every main PR suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f"Required validation did not pass: {failed}")
          PYCODE
