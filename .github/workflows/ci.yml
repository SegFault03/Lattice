name: Build and compatibility checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep push and PR groups separate: a head push must not cancel validation of its merge commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-checks:
    # PR checkout tests the merge commit, including integration with the current base branch.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Test development tools
        run: python -m unittest discover -s scripts/tests -v
      - name: Build and run unit and live functional tests
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/test.py --live --mysql --hsqldb --build
      - name: Build and run unit tests
        if: matrix.os != 'ubuntu-24.04'
        run: python scripts/test.py --build
      - name: Render dark and light UI inside IntelliJ IDEA
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 x11-utils
          ./scripts/linux/review-intellij-ui.sh ExperimentalDark
          LATTICE_UI_STYLE_ONLY=true ./scripts/linux/review-intellij-ui.sh ExperimentalLight
      - name: Retain plugin for PR compatibility checks
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-under-test
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 1
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
            build/fixtures/
            build/ui-review/
          retention-days: 7

  ide-compatibility:
    needs: commit-checks
    if: github.event_name == 'pull_request' && needs.commit-checks.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        ide: ['2025.1', '2025.2', '2025.3']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-under-test
          path: build/distributions
      - name: Verify the exact tested plugin
        env:
          IDE_VERSION: ${{ matrix.ide }}
        run: |
          archives=(build/distributions/*.zip)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
          python3 scripts/verify-plugin.py "${archives[0]}" --ide-version "$IDE_VERSION" \
            --java-home "$JAVA_HOME" --cache "$RUNNER_TEMP/lattice-test-binaries"
      - name: Retain verifier reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-pr-${{ matrix.ide }}
          if-no-files-found: ignore
          path: build/compatibility/verifier-ci/
          retention-days: 7

  database-compatibility:
    needs: commit-checks
    if: github.event_name == 'pull_request' && needs.commit-checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run JDBC and Java 8 compatibility matrices
        run: python3 scripts/one-shot-test.py --database-compatibility-only
      - name: Retain JDBC compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-pr-jdbc
          if-no-files-found: ignore
          path: |
            build/compatibility/
            build/one-shot-test/
          retention-days: 7

  compatibility:
    needs: [commit-checks, ide-compatibility, database-compatibility]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all compatibility gates to pass
        env:
          BASELINE_RESULT: ${{ needs.commit-checks.result }}
          IDE_RESULT: ${{ needs.ide-compatibility.result }}
          JDBC_RESULT: ${{ needs.database-compatibility.result }}
        run: |
          [[ "$BASELINE_RESULT" == success && "$IDE_RESULT" == success && "$JDBC_RESULT" == success ]]
