name: Build, test and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional X.Y.Z or X.Y.Z-alpha for a dry run; manual runs never publish'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-platform-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Test development tools
        run: python -m unittest discover -s scripts/tests -v
      - name: Build and run unit tests
        run: python scripts/test.py --build
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tests-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
            build/fixtures/
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      source_asset: ${{ steps.source.outputs.filename }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: shop_db
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release tag to point to main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Prepare version and patch notes
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py
      - name: Compile, test and package
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: >-
          python3 scripts/test.py --live --hsqldb --build
          --version "$RELEASE_VERSION"
          --notes-file build/release/patch-notes.html
      - name: Render dark and light production UI inside IntelliJ IDEA
        env:
          LATTICE_UI_PLUGIN_VERSION: ${{ steps.metadata.outputs.version }}
          LATTICE_UI_RELEASE_NOTES_FILE: build/release/patch-notes.html
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 x11-utils
          ./scripts/review-intellij-ui.sh ExperimentalDark
          LATTICE_UI_STYLE_ONLY=true ./scripts/review-intellij-ui.sh ExperimentalLight
      - name: Prepare corresponding source asset
        id: source
        run: python3 scripts/prepare-source-asset.py --github-output "$GITHUB_OUTPUT"
      - name: Validate ZIP and generate asset checksums
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_ASSET: ${{ steps.source.outputs.filename }}
        run: >-
          python3 scripts/check-release-archive.py "build/distributions/Lattice-$RELEASE_VERSION.zip"
          --version "$RELEASE_VERSION"
          --source "build/release/$SOURCE_ASSET"
          --checksums build/release/SHA256SUMS
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            build/distributions/Lattice-${{ steps.metadata.outputs.version }}.zip
            build/release/release-notes.md
            build/release/version.txt
            build/release/${{ steps.source.outputs.filename }}
            build/release/SHA256SUMS
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics
          retention-days: 7
          path: |
            build/reports/tests/
            build/test-results/
            build/fixtures/
            build/ui-review/

  database-compatibility:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run the JDBC and Java 8 compatibility matrix
        run: python3 scripts/one-shot-test.py --database-compatibility-only
      - name: Retain database compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-database-compatibility
          if-no-files-found: ignore
          path: |
            build/compatibility/
            build/one-shot-test/
          retention-days: 7

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ide: ['2025.1', '2025.2', '2025.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build
      - name: Verify the exact release candidate
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          IDE_VERSION: ${{ matrix.ide }}
        run: >-
          python3 scripts/verify-plugin.py "build/distributions/Lattice-$RELEASE_VERSION.zip"
          --ide-version "$IDE_VERSION" --java-home "$JAVA_HOME"
          --cache "$RUNNER_TEMP/lattice-test-binaries"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.ide }}
          retention-days: 7
          path: build/compatibility/verifier-ci/

  publish:
    needs: [build, cross-platform-checks, verify, database-compatibility]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build
      - name: Publish tested assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
          SOURCE_ASSET: ${{ needs.build.outputs.source_asset }}
        run: |
          release_flags=()
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "build/distributions/Lattice-$RELEASE_VERSION.zip" \
            "build/release/$SOURCE_ASSET" build/release/SHA256SUMS \
            --verify-tag --draft --title "Lattice $RELEASE_VERSION" \
            --notes-file build/release/release-notes.md "${release_flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
