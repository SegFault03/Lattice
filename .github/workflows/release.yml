name: Build, test and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional X.Y.Z for a dry run; manual runs never publish'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: shop_db
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Prepare version and patch notes
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py
      - name: Start HSQLDB fixture
        run: bash scripts/start-ci-hsqldb.sh
      - name: Compile, test and package
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: >-
          ./gradlew --no-daemon test integrationTest buildPlugin
          "-PreleaseVersion=$RELEASE_VERSION"
          -PreleaseNotesFile=build/release/patch-notes.html
      - name: Prepare corresponding source asset
        run: python3 scripts/prepare-source-asset.py
      - name: Validate ZIP and generate asset checksums
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: >-
          python3 scripts/check-release-archive.py "build/distributions/Lattice-$RELEASE_VERSION.zip"
          --version "$RELEASE_VERSION"
          --source build/release/mysql-connector-j-9.0.0-source.tar.gz
          --checksums build/release/SHA256SUMS
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            build/distributions/*.zip
            build/release/release-notes.md
            build/release/version.txt
            build/release/mysql-connector-j-9.0.0-source.tar.gz
            build/release/SHA256SUMS
      - name: Stop HSQLDB fixture
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/hsqldb.pid" ]]; then
            fixture_pid="$(cat "$RUNNER_TEMP/hsqldb.pid")"
            kill "$fixture_pid" 2>/dev/null || true
          fi
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          retention-days: 7
          path: |
            build/reports/tests/
            build/test-results/
            ${{ runner.temp }}/hsqldb.log

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ide: ['2025.1', '2025.2', '2025.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: build
      - name: Verify the exact release candidate
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          IDE_VERSION: ${{ matrix.ide }}
        run: >-
          python3 scripts/verify-plugin.py "build/distributions/Lattice-$RELEASE_VERSION.zip"
          --ide-version "$IDE_VERSION" --java-home "$JAVA_HOME"
          --cache "$RUNNER_TEMP/lattice-test-binaries"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.ide }}
          retention-days: 7
          path: build/compatibility/verifier-ci/

  publish:
    needs: [build, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: build
      - name: Publish tested assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/distributions/Lattice-$RELEASE_VERSION.zip" \
            build/release/mysql-connector-j-9.0.0-source.tar.gz build/release/SHA256SUMS \
            --verify-tag --draft --title "Lattice $RELEASE_VERSION" \
            --notes-file build/release/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
