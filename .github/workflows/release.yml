name: Build, test and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for dry run; required unused prerelease version for Marketplace smoke testing'
        required: false
        type: string
      marketplace_smoke:
        description: 'Submit a signed, hidden update to the smoke channel; never create a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-platform-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Test development tools
        run: python -m unittest discover -s scripts/tests -v
      - name: Build and run unit tests
        run: python scripts/test.py --build
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tests-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
            build/fixtures/
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      source_asset: ${{ steps.source.outputs.filename }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: shop_db
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release tag to point to main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Prepare version and patch notes
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          MARKETPLACE_SMOKE: ${{ inputs.marketplace_smoke }}
        run: |
          flags=()
          if [[ "$MARKETPLACE_SMOKE" == "true" ]]; then
            flags+=(--marketplace-smoke)
          fi
          python3 scripts/release.py "${flags[@]}"
      - name: Compile, test and package
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: >-
          python3 scripts/test.py --live --hsqldb --build
          --version "$RELEASE_VERSION"
          --notes-file build/release/patch-notes.html
      - name: Validate production Swing previews and action states
        run: python3 scripts/ui-preview.py --all-previews
      - name: Render dark and light production UI inside IntelliJ IDEA
        env:
          LATTICE_UI_PLUGIN_VERSION: ${{ steps.metadata.outputs.version }}
          LATTICE_UI_RELEASE_NOTES_FILE: build/release/patch-notes.html
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 x11-utils
          ./scripts/linux/review-intellij-ui.sh ExperimentalDark
          LATTICE_UI_STYLE_ONLY=true ./scripts/linux/review-intellij-ui.sh ExperimentalLight
      - name: Prepare corresponding source asset
        id: source
        run: python3 scripts/prepare-source-asset.py --github-output "$GITHUB_OUTPUT"
      - name: Sign and verify the release ZIP
        if: github.event_name == 'push' || inputs.marketplace_smoke
        env:
          LATTICE_SIGNING_PRIVATE_KEY: ${{ secrets.LATTICE_SIGNING_PRIVATE_KEY }}
          LATTICE_SIGNING_CERTIFICATE_CHAIN: ${{ secrets.LATTICE_SIGNING_CERTIFICATE_CHAIN }}
          LATTICE_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LATTICE_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ./gradlew signPlugin verifyPluginSignature --no-daemon --no-configuration-cache \
            -Plattice.requireSigning=true -PreleaseVersion="$RELEASE_VERSION" \
            -PreleaseNotesFile=build/release/patch-notes.html
          test -s "build/distributions/Lattice-$RELEASE_VERSION-signed.zip"
          mv "build/distributions/Lattice-$RELEASE_VERSION-signed.zip" "build/distributions/Lattice-$RELEASE_VERSION.zip"
      - name: Validate ZIP and generate asset checksums
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_ASSET: ${{ steps.source.outputs.filename }}
        run: >-
          python3 scripts/check-release-archive.py "build/distributions/Lattice-$RELEASE_VERSION.zip"
          --version "$RELEASE_VERSION"
          --source "build/release/$SOURCE_ASSET"
          --checksums build/release/SHA256SUMS
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            build/distributions/Lattice-${{ steps.metadata.outputs.version }}.zip
            build/release/release-notes.md
            build/release/version.txt
            build/release/${{ steps.source.outputs.filename }}
            build/release/SHA256SUMS
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics
          retention-days: 7
          path: |
            build/reports/tests/
            build/test-results/
            build/fixtures/
            build/ui-review/
            build/ui-preview/

  database-compatibility:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run the JDBC and Java 8 compatibility matrix
        run: python3 scripts/one-shot-test.py --database-compatibility-only
      - name: Retain database compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-database-compatibility
          if-no-files-found: ignore
          path: |
            build/compatibility/
            build/one-shot-test/
          retention-days: 7

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ide: ['2025.1', '2025.2', '2025.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build
      - name: Verify the exact release candidate
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          IDE_VERSION: ${{ matrix.ide }}
        run: >-
          python3 scripts/verify-plugin.py "build/distributions/Lattice-$RELEASE_VERSION.zip"
          --ide-version "$IDE_VERSION" --java-home "$JAVA_HOME"
          --cache "$RUNNER_TEMP/lattice-test-binaries"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.ide }}
          retention-days: 7
          path: build/compatibility/verifier-ci/

  publish:
    needs: [build, cross-platform-checks, verify, database-compatibility]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build
      - name: Publish tested assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
          SOURCE_ASSET: ${{ needs.build.outputs.source_asset }}
        run: |
          release_flags=()
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "build/distributions/Lattice-$RELEASE_VERSION.zip" \
            "build/release/$SOURCE_ASSET" build/release/SHA256SUMS \
            --verify-tag --draft --title "Lattice $RELEASE_VERSION" \
            --notes-file build/release/release-notes.md "${release_flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false

  marketplace:
    needs: [build, cross-platform-checks, verify, database-compatibility, publish]
    # always() permits smoke runs when the GitHub publish job is intentionally skipped.
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      needs.cross-platform-checks.result == 'success' && needs.verify.result == 'success' &&
      needs.database-compatibility.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.marketplace_smoke))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build
      - name: Upload signed ZIP to Marketplace
        env:
          MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          MARKETPLACE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'smoke' || '' }}
          MARKETPLACE_HIDDEN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          test -n "$MARKETPLACE_TOKEN" || { echo 'Missing JETBRAINS_MARKETPLACE_TOKEN secret' >&2; exit 1; }
          # Reject unexpected combinations instead of accidentally exposing a smoke build.
          if [[ "$MARKETPLACE_CHANNEL" == "smoke" ]]; then
            [[ "$MARKETPLACE_HIDDEN" == "true" && "$RELEASE_VERSION" == *-* ]]
          else
            [[ -z "$MARKETPLACE_CHANNEL" && "$MARKETPLACE_HIDDEN" == "false" ]]
          fi
          (cd build/distributions && sha256sum --check --ignore-missing ../release/SHA256SUMS)
          # Keep the token out of command arguments and do not retry an ambiguous upload.
          printf 'header = "Authorization: Bearer %s"\n' "$MARKETPLACE_TOKEN" | \
            curl --config - --fail-with-body --silent --show-error --max-time 300 \
              --form-string 'xmlId=com.segfault03.lattice' \
              --form "file=@build/distributions/Lattice-$RELEASE_VERSION.zip" \
              --form-string "channel=$MARKETPLACE_CHANNEL" --form-string "isHidden=$MARKETPLACE_HIDDEN" \
              https://plugins.jetbrains.com/api/updates/upload \
              --output build/release/marketplace-upload.json
          cat build/release/marketplace-upload.json
          printf '### Marketplace submission\n\nSubmitted Lattice %s to channel `%s`, with `isHidden=%s`. JetBrains approval is still required.\n' "$RELEASE_VERSION" "${MARKETPLACE_CHANNEL:-Stable}" "$MARKETPLACE_HIDDEN" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain Marketplace response
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-response
          path: build/release/marketplace-upload.json
          if-no-files-found: ignore
          retention-days: 7
